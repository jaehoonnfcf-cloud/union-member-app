<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<title>조합원 사업장관리</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e3e3e6;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --muted: #71717a;
    --accent: #1f5c4a;
    --accent-light: #e9f2ee;
    --accent-dark: #164536;
    --warn: #9a5b2e;
    --warn-light: #fbf0e6;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 1680px;
    width: 92%;
    margin: 0 auto;
    padding: 36px 0 72px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
    transition: box-shadow .15s ease;
  }
  .card h3 {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin: 16px 0 6px;
  }
  label .hint { font-weight: 400; color: var(--muted); }
  input[type=text], textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface);
    transition: border-color .12s ease;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  input[readonly] { background: #f4f4f5; color: var(--muted); }
  textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  button:hover { background: #f4f4f5; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-dark); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { background: #f4f4f5; }
  .search-results {
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    margin-top: 6px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
  }
  .search-item {
    padding: 9px 11px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: var(--accent-light); }
  .search-item b { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted);
  }
  .status-line { font-size: 12px; margin-top: 6px; }
  .status-line.ok { color: var(--accent); }
  .status-line.muted { color: var(--muted); }
  .lookup-box {
    background: #f6f9f8;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 14px 14px 12px;
    margin: 14px 0 4px;
  }
  .lookup-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
  }
  .lookup-title .hint { font-weight: 400; font-size: 11px; }
  .lookup-divider {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin: 12px 0;
    position: relative;
  }
  .lookup-divider::before, .lookup-divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 40%;
    border-top: 1px solid var(--border-strong);
  }
  .lookup-divider::before { left: 0; }
  .lookup-divider::after { right: 0; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(24,24,27,0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
    z-index: 100;
  }
  .modal-box {
    background: var(--surface);
    border-radius: 10px;
    width: 92%;
    max-width: 480px;
    max-height: 70vh;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-results {
    margin-top: 12px;
    overflow-y: auto;
    font-size: 13px;
  }
  .modal-result-item {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-result-item:hover { background: var(--accent-light); }
  .modal-result-item b { font-weight: 700; }
  .modal-result-item .meta { color: var(--muted); font-size: 12px; }
  .banner {
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 14px;
    white-space: pre-wrap;
    border: 1px solid transparent;
  }
  .banner.ok { background: var(--accent-light); color: var(--accent-dark); border-color: #c9e2d6; }
  .banner.warn { background: var(--warn-light); color: var(--warn); border-color: #f0d9bf; }
  .banner.info { background: #f4f4f5; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  tbody tr:hover { background: #fafafa; }
  .table-scroll { overflow-x: auto; min-width: 0; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.member { background: var(--accent-light); color: var(--accent-dark); }
  .badge.nonmember { background: #f4f4f5; color: var(--muted); }
  #appArea { display: none; }
  #loginArea {
    text-align: center;
    padding: 100px 0;
  }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }
  .account-info {
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
    padding-top: 2px;
  }
  .account-info .email { font-size: 12.5px; color: var(--muted); }
  .account-info a {
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .account-info a:hover { text-decoration: underline; }
  .account-info button { padding: 5px 12px; font-size: 12px; }

  .layout {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .layout .left .card { position: static; }
  }
  @media (max-width: 600px) {
    body { width: 94%; padding: 24px 0 60px; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .account-info { flex-wrap: wrap; white-space: normal; gap: 10px; }
    h1 { font-size: 18px; }
  }
  .layout .right,
  .layout .right .card {
    min-width: 0;
  }
  .layout .left .card { padding: 20px; position: sticky; top: 20px; }
  .del-cell { text-align: center; min-width: 64px; white-space: nowrap; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .icon-btn + .icon-btn { margin-left: 2px; }
  .icon-btn.edit-btn:hover { background: var(--accent-light); color: var(--accent-dark); }
  .icon-btn.delete-btn:hover { background: var(--warn-light); color: var(--warn); }
  .list-filter-btn.active {
    background: var(--accent-light);
    color: var(--accent-dark);
    font-weight: 700;
  }
</style>
</head>
<body>

  <div class="page-header">
    <div>
      <h1>조합원 사업장관리</h1>
      <p class="sub">사업장 정보를 등록하고 조합원 여부를 확인합니다.</p>
    </div>
    <div class="account-info" id="accountInfo" style="display:none;">
      <span class="email" id="userEmail"></span>
      <a id="adminLink" href="admin.html" style="display:none;">관리자 페이지</a>
      <button class="ghost" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div id="loginArea">
    <button class="primary" id="loginBtn">Google 계정으로 로그인</button>
    <div id="loginStatus" class="banner info" style="max-width:380px;margin:20px auto 0;">로그인이 필요합니다.</div>
  </div>

  <div id="appArea">
    <div class="layout">
      <div class="left">
        <div class="card">
          <h3 style="display:flex; align-items:center; justify-content:space-between;">
            <span>사업장 등록</span>
            <button class="ghost" id="openMemberSearchBtn" style="font-size:12px; padding:6px 10px; border:1px solid var(--border-strong);">조합원 검색 (팝업)</button>
          </h3>

          <div class="lookup-box">
            <div class="lookup-title">
              <span>조합원 조회</span>
              <span class="hint">고객번호 또는 휴대폰번호, 둘 중 하나만 입력하면 자동조회됩니다</span>
            </div>

            <label style="margin-top:0;">고객번호 <span class="hint">(8자리 숫자 또는 임시번호)</span></label>
            <div class="row">
              <input type="text" id="customerId" placeholder="예: 12345678 또는 a1234567" />
              <button id="genTempIdBtn" style="flex:0 0 auto;">임시번호 발급</button>
            </div>

            <div class="lookup-divider">또는</div>

            <label>휴대폰번호</label>
            <input type="text" id="mobilePhone" placeholder="010-0000-0000" />

            <div id="memberCheckStatus" class="status-line"></div>
          </div>

          <label>성명</label>
          <input type="text" id="customerName" placeholder="개인고객 실명" />

          <label>사업자번호 <span class="hint">(선택)</span></label>
          <input type="text" id="bizRegNo" placeholder="000-00-00000" maxlength="12" />

          <div class="toggle-row">
            <input type="checkbox" id="manualToggle" />
            <label for="manualToggle" style="margin:0;font-weight:400;">네이버 검색 없이 수기로 입력</label>
          </div>

          <div id="naverSearchBox">
            <label>상호 검색 (네이버)</label>
            <input type="text" id="naverQuery" placeholder="업체명 또는 주소로 검색" />
            <div id="naverResults" class="search-results" style="display:none;"></div>
          </div>

          <label style="display:flex; align-items:center; justify-content:space-between;">
            <span>상호</span>
            <a id="naverPlaceLink" href="#" target="_blank" rel="noopener" style="display:none; font-size:11.5px; font-weight:600; color:var(--accent); text-decoration:none;">네이버 플레이스 보기 ↗</a>
          </label>
          <input type="text" id="businessName" />
          <div id="naverPlaceUrlText" style="display:none; font-size:11px; color:var(--muted); word-break:break-all; margin-top:4px; padding:6px 8px; background:#f4f4f5; border-radius:6px;"></div>

          <label>주소</label>
          <input type="text" id="address" />

          <label>전화번호(대표번호)</label>
          <input type="text" id="phone" />

          <label>상품 <span class="hint">(취급 품목/업종)</span></label>
          <input type="text" id="category" />

          <label>기타사항 <span class="hint">(수기 메모)</span></label>
          <textarea id="memo" placeholder="고객 특징, 관련자 정보 등"></textarea>

      <div id="editingBanner" class="banner info" style="display:none;"></div>

          <div style="margin-top:18px; display:flex; gap:8px;">
            <button class="primary" id="saveBtn">저장</button>
            <button class="ghost" id="resetBtn">초기화</button>
          </div>

          <div id="saveStatus"></div>
        </div>
      </div>

      <div class="right">
        <div class="card">
          <h3 style="display:flex; align-items:center; justify-content:space-between; border-bottom:none; margin-bottom:10px; padding-bottom:0;">
            <span>전체 등록 현황</span>
            <span style="display:flex; gap:4px;">
              <button class="ghost list-filter-btn active" data-mode="all" style="padding:5px 12px; font-size:12px;">전체</button>
              <button class="ghost list-filter-btn" data-mode="mine" style="padding:5px 12px; font-size:12px;">내 등록만</button>
            </span>
          </h3>
          <input type="text" id="listSearch" placeholder="업체명, 주소, 전화번호, 고객번호로 검색 (이미 등록된 업체인지 확인)" style="margin-bottom:14px;" />
          <div style="border-bottom:1px solid var(--border); margin-bottom:16px;"></div>
          <div class="table-scroll" id="listArea">불러오는 중</div>
        </div>
      </div>
    </div>
  </div>

  <div id="memberSearchModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="margin:0; border:none; padding:0;">조합원 검색</h3>
        <button class="ghost" id="closeMemberSearchBtn" style="padding:4px 10px;">닫기</button>
      </div>
      <input type="text" id="memberSearchInput" placeholder="성명 또는 휴대폰번호로 검색" autocomplete="off" />
      <div id="memberSearchResults" class="modal-results">검색어를 입력해주세요.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://kakujhsdxyljkstpfymk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtha3VqaHNkeHlsamtzdHBmeW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDM1OTYsImV4cCI6MjEwMDkxOTU5Nn0.5mKR4Zksu9J791-fqM9KL-scOS0xB3Hhvj5nuQKoVbE";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserEmail = null;
    let selectedNaverItem = null;

    const el = (id) => document.getElementById(id);

    el("loginBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href }
      });
    });

    el("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });

    async function checkAllowedUser(email) {
      const { data, error } = await supabaseClient
        .from("allowed_users")
        .select("email, role, name")
        .eq("email", email)
        .maybeSingle();
      if (error || !data) return null;
      return data;
    }

    async function refreshUI() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        el("loginArea").style.display = "block";
        el("appArea").style.display = "none";
        el("accountInfo").style.display = "none";
        return;
      }
      currentUserEmail = session.user.email;
      const allowed = await checkAllowedUser(currentUserEmail);
      if (!allowed) {
        el("loginArea").style.display = "block";
        el("appArea").style.display = "none";
        el("accountInfo").style.display = "none";
        el("loginStatus").className = "banner warn";
        el("loginStatus").textContent =
          `${currentUserEmail} 계정은 접근이 허용되지 않았습니다. 관리자에게 등록을 요청하세요.`;
        return;
      }
      el("loginArea").style.display = "none";
      el("appArea").style.display = "block";
      el("accountInfo").style.display = "flex";
      el("userEmail").textContent = `${allowed.name || currentUserEmail} · ${allowed.role}`;
      if (allowed.role === "admin") {
        el("adminLink").style.display = "inline-block";
      }
      loadRecentList();
    }

    supabaseClient.auth.onAuthStateChange(() => refreshUI());
    refreshUI();

    el("genTempIdBtn").addEventListener("click", () => {
      const rand = Math.floor(1000000 + Math.random() * 9000000);
      const letters = "abcdefghjkmnpqrstuvwxyz";
      const prefix = letters[Math.floor(Math.random() * letters.length)];
      el("customerId").value = prefix + rand;
    });

    // ---------- 고객번호 입력 시 조합원명단 자동조회 ----------
    let customerIdDebounce = null;
    el("customerId").addEventListener("input", (e) => {
      clearTimeout(customerIdDebounce);
      const id = e.target.value.trim();
      customerIdDebounce = setTimeout(() => checkCustomerId(id), 400);
    });

    el("customerId").addEventListener("blur", (e) => {
      let val = e.target.value.trim();
      // 앞자리 0이 빠진 채로 입력/붙여넣기된 경우 8자리로 보정 (임시번호 형식은 건드리지 않음)
      if (/^\d+$/.test(val) && val.length > 0 && val.length < 8) {
        val = val.padStart(8, "0");
        e.target.value = val;
        checkCustomerId(val);
      }
    });

    async function checkCustomerId(id) {
      const statusBox = el("memberCheckStatus");
      const nameInput = el("customerName");
      const mobileInput = el("mobilePhone");

      if (!/^\d{8}$/.test(id)) {
        statusBox.textContent = "";
        statusBox.className = "status-line";
        nameInput.readOnly = false;
        mobileInput.readOnly = false;
        return;
      }

      const { data, error } = await supabaseClient
        .from("customers")
        .select("name, mobile_phone, is_member")
        .eq("customer_id", id)
        .maybeSingle();

      if (error || !data) {
        statusBox.textContent = "조합원 명단에 없는 고객번호입니다. 성명/휴대폰번호를 직접 입력해주세요.";
        statusBox.className = "status-line muted";
        nameInput.readOnly = false;
        mobileInput.readOnly = false;
        return;
      }

      if (data.is_member) {
        nameInput.value = data.name || "";
        mobileInput.value = data.mobile_phone || "";
        nameInput.readOnly = true;
        mobileInput.readOnly = true;
        statusBox.innerHTML = `조합원 명단 확인됨 · 성명/휴대폰번호 자동입력 (<a href="#" id="unlockNameBtn">직접 수정</a>)`;
        statusBox.className = "status-line ok";
        const unlockBtn = document.getElementById("unlockNameBtn");
        if (unlockBtn) {
          unlockBtn.addEventListener("click", (ev) => {
            ev.preventDefault();
            nameInput.readOnly = false;
            mobileInput.readOnly = false;
          });
        }
      } else {
        nameInput.value = data.name || "";
        mobileInput.value = data.mobile_phone || "";
        nameInput.readOnly = false;
        mobileInput.readOnly = false;
        statusBox.textContent = "조합원은 아니지만 기존 등록된 고객번호입니다.";
        statusBox.className = "status-line muted";
      }
    }

    // ---------- 사업자번호 자동 하이픈 ----------
    // ---------- 휴대폰번호 입력 시 고객번호 역조회 ----------
    let mobileDebounce = null;
    el("mobilePhone").addEventListener("input", (e) => {
      clearTimeout(mobileDebounce);
      const val = e.target.value.trim();
      // 고객번호가 이미 채워져 있으면(수기 입력 중이거나 이미 조회됨) 역조회로 덮어쓰지 않음
      if (el("customerId").value.trim()) return;
      const digits = val.replace(/\D/g, "");
      if (digits.length < 8) return;
      mobileDebounce = setTimeout(() => lookupByMobile(val), 400);
    });

    async function lookupByMobile(mobile) {
      const statusBox = el("memberCheckStatus");
      const { data, error } = await supabaseClient.rpc("find_customer_by_mobile", { p_mobile: mobile });

      if (error || !data || data.length === 0) return;

      if (data.length === 1) {
        applyMobileMatch(data[0]);
      } else {
        statusBox.innerHTML = `이 번호로 여러 명이 조회됩니다: ` +
          data.map(d => `<a href="#" class="mobile-match" data-id="${d.customer_id}">${d.name || d.customer_id}(${d.customer_id})</a>`).join(", ");
        statusBox.className = "status-line muted";
        document.querySelectorAll(".mobile-match").forEach(a => {
          a.addEventListener("click", (ev) => {
            ev.preventDefault();
            const match = data.find(d => d.customer_id === a.dataset.id);
            applyMobileMatch(match);
          });
        });
      }
    }

    function applyMobileMatch(match) {
      el("customerId").value = match.customer_id;
      el("customerName").value = match.name || "";
      el("customerName").readOnly = !!match.is_member;
      el("mobilePhone").readOnly = !!match.is_member;
      const statusBox = el("memberCheckStatus");
      statusBox.innerHTML = match.is_member
        ? `휴대폰번호로 조합원 확인됨 · 고객번호 자동입력 (<a href="#" id="unlockNameBtn">직접 수정</a>)`
        : `휴대폰번호로 기존 고객 확인됨 (조합원 아님) · 고객번호 자동입력`;
      statusBox.className = "status-line ok";
      const unlockBtn = document.getElementById("unlockNameBtn");
      if (unlockBtn) {
        unlockBtn.addEventListener("click", (ev) => {
          ev.preventDefault();
          el("customerName").readOnly = false;
          el("mobilePhone").readOnly = false;
        });
      }
    }

    // ---------- 조합원 검색 팝업 ----------
    el("openMemberSearchBtn").addEventListener("click", () => {
      el("memberSearchModal").style.display = "flex";
      el("memberSearchInput").value = "";
      el("memberSearchResults").innerHTML = "검색어를 입력해주세요.";
      el("memberSearchInput").focus();
    });

    el("closeMemberSearchBtn").addEventListener("click", () => {
      el("memberSearchModal").style.display = "none";
    });

    el("memberSearchModal").addEventListener("click", (e) => {
      if (e.target.id === "memberSearchModal") el("memberSearchModal").style.display = "none";
    });

    let memberSearchDebounce = null;
    el("memberSearchInput").addEventListener("input", (e) => {
      clearTimeout(memberSearchDebounce);
      const q = e.target.value.trim();
      if (q.length < 2) {
        el("memberSearchResults").innerHTML = "검색어를 2글자 이상 입력해주세요.";
        return;
      }
      memberSearchDebounce = setTimeout(() => searchMembers(q), 300);
    });

    async function searchMembers(q) {
      el("memberSearchResults").innerHTML = "검색 중...";
      const { data, error } = await supabaseClient
        .from("customers")
        .select("customer_id, name, mobile_phone, is_member")
        .eq("is_member", true)
        .or(`name.ilike.%${q}%,mobile_phone.ilike.%${q}%`)
        .order("name")
        .limit(30);

      if (error) {
        el("memberSearchResults").innerHTML = `조회 실패: ${error.message}`;
        return;
      }
      if (!data || data.length === 0) {
        el("memberSearchResults").innerHTML = "검색 결과가 없습니다.";
        return;
      }
      el("memberSearchResults").innerHTML = data.map(m => `
        <div class="modal-result-item" data-id="${m.customer_id}">
          <div><b>${m.name || "(이름 없음)"}</b> <span class="meta">${m.customer_id}</span></div>
          <div class="meta">${m.mobile_phone || ""}</div>
        </div>
      `).join("");

      document.querySelectorAll(".modal-result-item").forEach(item => {
        item.addEventListener("click", () => {
          const match = data.find(m => m.customer_id === item.dataset.id);
          applyMobileMatch(match);
          el("memberSearchModal").style.display = "none";
        });
      });
    }

    el("bizRegNo").addEventListener("input", (e) => {
      let digits = e.target.value.replace(/\D/g, "").slice(0, 10);
      let formatted = digits;
      if (digits.length > 5) {
        formatted = `${digits.slice(0,3)}-${digits.slice(3,5)}-${digits.slice(5)}`;
      } else if (digits.length > 3) {
        formatted = `${digits.slice(0,3)}-${digits.slice(3)}`;
      }
      e.target.value = formatted;
    });

    el("manualToggle").addEventListener("change", (e) => {
      el("naverSearchBox").style.display = e.target.checked ? "none" : "block";
      selectedNaverItem = null;
    });

    let debounceTimer = null;
    el("naverQuery").addEventListener("input", (e) => {
      clearTimeout(debounceTimer);
      const q = e.target.value.trim();
      if (q.length < 2) {
        el("naverResults").style.display = "none";
        return;
      }
      debounceTimer = setTimeout(() => searchNaver(q), 400);
    });

    async function searchNaver(query) {
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/bright-api`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "apikey": SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        renderNaverResults(data.items || []);
      } catch (e) {
        el("naverResults").style.display = "block";
        el("naverResults").innerHTML = `<div class="search-item">검색 실패: ${e}</div>`;
      }
    }

    function renderNaverResults(items) {
      const box = el("naverResults");
      if (items.length === 0) {
        box.style.display = "block";
        box.innerHTML = `<div class="search-item">검색 결과 없음 — 수기입력을 이용하세요</div>`;
        return;
      }
      box.style.display = "block";
      box.innerHTML = items.map((item, i) => `
        <div class="search-item" data-idx="${i}">
          <b>${item.title}</b>
          ${item.roadAddress || item.address} · ${item.telephone || "전화번호 없음"}
        </div>
      `).join("");
      box.querySelectorAll(".search-item[data-idx]").forEach((elm) => {
        elm.addEventListener("click", () => {
          const item = items[elm.dataset.idx];
          selectedNaverItem = item;
          el("businessName").value = item.title;
          el("address").value = item.roadAddress || item.address;
          el("phone").value = item.telephone || "";
          el("category").value = item.category || "";
          box.style.display = "none";
          el("naverQuery").value = item.title;

          const linkEl = el("naverPlaceLink");
          const urlTextEl = el("naverPlaceUrlText");
          const safeUrl = buildNaverMapSearchUrl(item.title, item.roadAddress || item.address);
          linkEl.href = safeUrl;
          linkEl.style.display = "inline";
          urlTextEl.textContent = safeUrl;
          urlTextEl.style.display = "block";
        });
      });
    }

    function normalizeKey(name, address) {
      return (name + address).toLowerCase().replace(/[^a-z0-9가-힣]/g, "");
    }

    // 업체가 등록한 임의의 링크(item.link)는 신뢰하지 않고,
    // 상호명+주소로 네이버 지도 검색 URL을 직접 만들어서 항상 map.naver.com으로만 연결되게 함
    function buildNaverMapSearchUrl(name, address) {
      const q = address ? `${name} ${address}` : name;
      return `https://map.naver.com/p/search/${encodeURIComponent(q)}`;
    }

    el("saveBtn").addEventListener("click", async () => saveEntry(false));

    async function saveEntry(force) {
      const customerId = el("customerId").value.trim();
      const businessName = el("businessName").value.trim();
      const address = el("address").value.trim();
      const phone = el("phone").value.trim();
      const category = el("category").value.trim();
      const memo = el("memo").value.trim();
      const bizRegNo = el("bizRegNo").value.trim();

      if (!customerId || !businessName) {
        showSaveStatus("고객번호와 상호는 필수입니다.", "warn");
        return;
      }
      if (!/^\d{8}$/.test(customerId) && !/^[a-z]\d{7}$/i.test(customerId)) {
        showSaveStatus("고객번호 형식이 올바르지 않습니다. (8자리 숫자 또는 영문1+숫자7)", "warn");
        return;
      }
      if (bizRegNo && !/^\d{3}-\d{2}-\d{5}$/.test(bizRegNo)) {
        showSaveStatus("사업자번호 형식이 올바르지 않습니다. (000-00-00000)", "warn");
        return;
      }

      const dupKey = normalizeKey(businessName, address);
      const naverPlaceUrl = selectedNaverItem ? buildNaverMapSearchUrl(businessName, address) : null;

      if (!force && !editingId) {
        const { data: dups, error } = await supabaseClient.rpc("check_duplicate_business", {
          p_customer_id: customerId,
          p_phone: phone || null,
          p_naver_place_url: naverPlaceUrl,
          p_dup_key: dupKey
        });
        if (error) {
          showSaveStatus("중복체크 오류: " + error.message, "warn");
          return;
        }
        if (dups && dups.length > 0) {
          const d = dups[0];
          showSaveStatus(
            `이미 등록된 사업장일 수 있습니다.\n기존 상호: ${d.business_name} · 고객번호: ${d.customer_id} · 등록자: ${d.created_by_display}\n` +
            `다른 업체가 맞다면 아래 버튼으로 등록을 계속할 수 있습니다.`,
            "warn",
            true
          );
          return;
        }
      }

      await supabaseClient.from("customers").upsert({
        customer_id: customerId,
        is_temp_id: /^[a-z]/i.test(customerId),
        name: el("customerName").value.trim() || null,
        mobile_phone: el("mobilePhone").value.trim() || null
      }, { onConflict: "customer_id", ignoreDuplicates: true });

      if (editingId) {
        const { error: updateError } = await supabaseClient.from("business_sites").update({
          customer_id: customerId,
          business_name: businessName,
          address: address,
          phone: phone,
          category: category,
          business_reg_no: bizRegNo || null,
          duplicate_check_key: dupKey,
          memo: memo,
          updated_by: currentUserEmail
        }).eq("id", editingId);

        if (updateError) {
          showSaveStatus("수정 실패: " + updateError.message, "warn");
          return;
        }

        showSaveStatus("수정되었습니다.", "ok");
        stopEdit();
        clearForm();
        loadRecentList();
        return;
      }

      const { error: insertError } = await supabaseClient.from("business_sites").insert({
        customer_id: customerId,
        business_name: businessName,
        address: address,
        road_address: selectedNaverItem ? selectedNaverItem.roadAddress : null,
        phone: phone,
        category: category,
        business_reg_no: bizRegNo || null,
        menu_or_desc: selectedNaverItem ? selectedNaverItem.description : null,
        naver_place_id: naverPlaceUrl,
        naver_place_url: naverPlaceUrl,
        source_type: selectedNaverItem ? "naver" : "manual",
        duplicate_check_key: dupKey,
        memo: memo,
        created_by: currentUserEmail,
        updated_by: currentUserEmail
      });

      if (insertError) {
        showSaveStatus("저장 실패: " + insertError.message, "warn");
        return;
      }

      showSaveStatus("저장되었습니다.", "ok");
      clearForm();
      loadRecentList();
    }

    function showSaveStatus(msg, type, showForceBtn) {
      const box = el("saveStatus");
      box.innerHTML = `<div class="banner ${type}">${msg}</div>`;
      if (showForceBtn) {
        const btn = document.createElement("button");
        btn.textContent = "그대로 등록";
        btn.className = "primary";
        btn.style.marginTop = "8px";
        btn.onclick = () => saveEntry(true);
        box.appendChild(btn);
      }
    }

    function clearForm() {
      ["customerId","customerName","mobilePhone","bizRegNo","naverQuery","businessName","address","phone","category","memo"]
        .forEach(id => el(id).value = "");
      selectedNaverItem = null;
      el("naverResults").style.display = "none";
      el("customerName").readOnly = false;
      el("mobilePhone").readOnly = false;
      el("memberCheckStatus").innerHTML = "";
      el("naverPlaceLink").style.display = "none";
      el("naverPlaceUrlText").style.display = "none";
    }

    el("resetBtn").addEventListener("click", () => {
      stopEdit();
      clearForm();
      el("saveStatus").innerHTML = "";
    });

    let lastListData = [];
    let editingId = null;
    let listFilterMode = "all";
    let listSearchDebounce = null;

    document.querySelectorAll(".list-filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        listFilterMode = btn.dataset.mode;
        document.querySelectorAll(".list-filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadRecentList();
      });
    });

    el("listSearch").addEventListener("input", () => {
      clearTimeout(listSearchDebounce);
      listSearchDebounce = setTimeout(() => loadRecentList(), 300);
    });

    async function loadRecentList() {
      let query = supabaseClient
        .from("business_sites_view")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(1000);

      if (listFilterMode === "mine" && currentUserEmail) {
        query = query.eq("created_by", currentUserEmail);
      }

      const search = el("listSearch").value.trim();
      if (search) {
        query = query.or(
          `business_name.ilike.%${search}%,address.ilike.%${search}%,phone.ilike.%${search}%,customer_id.ilike.%${search}%,customer_name.ilike.%${search}%`
        );
      }

      const { data, error } = await query;

      if (error) {
        el("listArea").innerHTML = `조회 실패: ${error.message}`;
        return;
      }
      if (!data || data.length === 0) {
        el("listArea").innerHTML = el("listSearch").value.trim()
          ? `검색 결과가 없습니다. 아직 등록되지 않은 업체일 수 있습니다.`
          : `등록된 사업장이 없습니다.`;
        return;
      }
      lastListData = data;
      el("listArea").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>고객번호</th><th>성명</th><th>휴대폰</th><th>상호</th><th>주소</th>
              <th>전화</th><th>상품</th><th>사업자번호</th><th>조합원</th><th>등록자</th><th class="del-cell">관리</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(r => `
              <tr>
                <td>${r.customer_id}</td>
                <td>${r.customer_name || "-"}</td>
                <td>${r.customer_mobile || ""}</td>
                <td>
                  ${r.business_name}
                  ${(() => {
                    const safeUrl = buildNaverMapSearchUrl(r.business_name, r.address || "");
                    return `<div style="font-size:10.5px; color:var(--muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${safeUrl}"><a href="${safeUrl}" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:none;">지도에서 확인 ↗</a></div>`;
                  })()}
                </td>
                <td>${r.address || ""}</td>
                <td>${r.phone || ""}</td>
                <td>${r.category || ""}</td>
                <td>${r.business_reg_no || ""}</td>
                <td><span class="badge ${r.is_member ? "member" : "nonmember"}">${r.is_member ? "조합원" : "비조합원"}</span></td>
                <td>${r.created_by_display || ""}</td>
                <td class="del-cell">
                  <button class="icon-btn edit-btn" data-id="${r.id}" title="수정">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                  </button>
                  <button class="icon-btn delete-btn" data-id="${r.id}" title="삭제">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                  </button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("이 사업장 등록건을 삭제할까요? 삭제 이력은 관리자 페이지에 남습니다.")) return;
          const { error } = await supabaseClient.from("business_sites").delete().eq("id", btn.dataset.id);
          if (error) {
            alert("삭제 실패: " + error.message + "\n본인이 등록한 건이 아니면 관리자만 삭제할 수 있습니다.");
            return;
          }
          loadRecentList();
        });
      });

      document.querySelectorAll(".edit-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const record = lastListData.find(r => r.id === btn.dataset.id);
          if (!record) return;
          startEdit(record);
        });
      });
    }

    function startEdit(record) {
      editingId = record.id;
      selectedNaverItem = null;

      el("customerId").value = record.customer_id || "";
      el("customerName").value = record.customer_name || "";
      el("mobilePhone").value = record.customer_mobile || "";
      el("bizRegNo").value = record.business_reg_no || "";
      el("businessName").value = record.business_name || "";
      el("address").value = record.address || "";
      el("phone").value = record.phone || "";
      el("category").value = record.category || "";
      el("memo").value = record.memo || "";

      el("customerName").readOnly = false;
      el("mobilePhone").readOnly = false;
      el("memberCheckStatus").innerHTML = "";

      el("manualToggle").checked = true;
      el("naverSearchBox").style.display = "none";

      const linkEl = el("naverPlaceLink");
      const urlTextEl = el("naverPlaceUrlText");
      if (record.business_name) {
        const safeUrl = buildNaverMapSearchUrl(record.business_name, record.address || "");
        linkEl.href = safeUrl;
        linkEl.style.display = "inline";
        urlTextEl.textContent = safeUrl;
        urlTextEl.style.display = "block";
      } else {
        linkEl.style.display = "none";
        urlTextEl.style.display = "none";
      }

      el("editingBanner").style.display = "block";
      el("editingBanner").textContent = `"${record.business_name}" 수정 중 — 저장을 누르면 이 건이 수정됩니다.`;
      el("saveBtn").textContent = "수정 저장";
      el("resetBtn").textContent = "수정 취소";
      el("saveStatus").innerHTML = "";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function stopEdit() {
      editingId = null;
      el("editingBanner").style.display = "none";
      el("saveBtn").textContent = "저장";
      el("resetBtn").textContent = "초기화";
    }
  </script>
</body>
</html>
