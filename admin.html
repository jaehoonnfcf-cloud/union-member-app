<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<title>관리자 페이지 · 조합원 사업장관리</title>
<style>
  :root {
    --bg: #f7f8f7;
    --surface: #ffffff;
    --border: #e7e9e8;
    --border-strong: #d7dad8;
    --text: #16181a;
    --muted: #6b7370;
    --accent: #2563eb;
    --accent-light: #eaf1fe;
    --accent-dark: #1d4fc4;
    --warn: #b5601f;
    --warn-light: #fdf1e6;
    --danger: #b0433f;
    --danger-light: #fceeed;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(16,24,20,0.05);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 1400px;
    width: 90%;
    margin: 0 auto;
    padding: 44px 0 80px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  a.back { font-size: 12.5px; color: var(--accent); text-decoration: none; font-weight: 600; }
  a.back:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 4px; margin: 24px 0 0; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--accent); border-color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin: 20px 0;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters input, .filters select {
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-size: 13px;
  }
  button {
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, transform .08s ease;
  }
  button:hover { background: #f4f5f4; }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(37,99,235,0.28); }
  button.primary:hover { background: var(--accent-dark); }
  button.danger { background: var(--danger-light); color: var(--danger); border-color: #f3d9d7; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  tbody tr:hover { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .badge.insert { background: var(--accent-light); color: var(--accent-dark); }
  .badge.update { background: #fdf3e0; color: #8a5a00; }
  .badge.delete { background: var(--danger-light); color: var(--danger); }
  .badge.force { background: var(--danger-light); color: var(--danger); }
  .diff-key { font-weight: 600; }
  .diff-old { color: var(--danger); text-decoration: line-through; }
  .diff-new { color: var(--accent-dark); }
  #blocked { text-align: center; padding: 100px 0; color: var(--muted); font-size: 14px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-row input { flex: 1; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13px; }
  select { padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13px; }
  .note { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; }
  .status-msg { font-size: 13px; margin-bottom: 12px; }
  .status-msg.ok { color: var(--accent-dark); }
  .status-msg.warn { color: var(--danger); }
</style>
</head>
<body>

  <a class="back" href="index.html">← 입력 페이지로</a>
  <h1>관리자 페이지</h1>
  <p class="sub">등록/수정 이력, 접근 사용자, 조합원명단을 관리합니다.</p>

  <div id="blocked" style="display:none;">
    관리자 권한이 없어 접근할 수 없습니다.
  </div>

  <div id="adminArea" style="display:none;">
    <div class="tabs">
      <div class="tab active" data-tab="history">이력관리</div>
      <div class="tab" data-tab="users">사용자관리</div>
      <div class="tab" data-tab="members">조합원명단</div>
    </div>

    <div id="tab-history" class="card">
      <div class="filters">
        <input type="text" id="filterActor" placeholder="등록자 이름" />
        <input type="text" id="filterBusiness" placeholder="사업장명" />
        <select id="filterAction">
          <option value="">전체 액션</option>
          <option value="INSERT">INSERT</option>
          <option value="UPDATE">UPDATE</option>
          <option value="DELETE">DELETE</option>
        </select>
        <button id="filterBtn">조회</button>
      </div>
      <div id="historyList">불러오는 중</div>
    </div>

    <div id="tab-users" class="card" style="display:none;">
      <div class="add-row">
        <input type="text" id="newUserEmail" placeholder="추가할 구글 이메일" />
        <input type="text" id="newUserName" placeholder="이름" style="flex:0 0 120px;" />
        <select id="newUserRole">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <button class="primary" id="addUserBtn">추가</button>
      </div>
      <div id="userStatus"></div>
      <div id="userList">불러오는 중</div>
    </div>

    <div id="tab-members" class="card" style="display:none;">
      <p class="note">
        CSV 형식: 1열 = 고객번호(8자리 숫자), 2열 = 성명, 3열 = 휴대폰번호.<br/>
        헤더 행이 있어도 자동으로 구분해서 건너뜁니다.<br/>
        <strong>업로드하면 기존 조합원 명단은 모두 해제되고, 이번에 올린 파일 기준으로만 조합원이 관리됩니다.</strong>
      </p>
      <div class="add-row">
        <input type="file" id="csvFile" accept=".csv" />
        <button class="primary" id="uploadCsvBtn">업로드</button>
      </div>
      <div id="csvStatus"></div>

      <h4 style="margin:20px 0 10px; font-size:13px;">최근 업로드 기록</h4>
      <div id="uploadLogList">불러오는 중</div>

      <h4 style="margin:20px 0 10px; font-size:13px;">등록된 조합원 수: <span id="memberCount">-</span></h4>
      <div class="filters">
        <input type="text" id="memberSearch" placeholder="고객번호 또는 성명 검색" />
        <button id="memberSearchBtn">검색</button>
      </div>
      <div id="memberList">불러오는 중</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const SUPABASE_URL = "https://kakujhsdxyljkstpfymk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtha3VqaHNkeHlsamtzdHBmeW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDM1OTYsImV4cCI6MjEwMDkxOTU5Nn0.5mKR4Zksu9J791-fqM9KL-scOS0xB3Hhvj5nuQKoVbE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const el = (id) => document.getElementById(id);
    let currentEmail = null;

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }
      currentEmail = session.user.email;
      const { data } = await supabaseClient
        .from("allowed_users")
        .select("email, role")
        .eq("email", currentEmail)
        .maybeSingle();

      if (!data || data.role !== "admin") {
        el("blocked").style.display = "block";
        return;
      }
      el("adminArea").style.display = "block";
      loadHistory();
      loadUsers();
    }
    init();

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        el("tab-history").style.display = tab.dataset.tab === "history" ? "block" : "none";
        el("tab-users").style.display = tab.dataset.tab === "users" ? "block" : "none";
        el("tab-members").style.display = tab.dataset.tab === "members" ? "block" : "none";
        if (tab.dataset.tab === "members") { loadMembers(); loadUploadLogs(); }
      });
    });

    el("filterBtn").addEventListener("click", loadHistory);

    function renderDiff(action, changed) {
      // INSERT/DELETE는 전체 레코드가 통째로 로그에 남아 너무 길어지므로 요약만 표시
      if (action === "INSERT") return `<span style="color:var(--muted);">신규 등록 (사업장/고객번호 컬럼 참고)</span>`;
      if (action === "DELETE") return `<span style="color:var(--muted);">삭제됨</span>`;
      if (!changed || Object.keys(changed).length === 0) return "-";
      return Object.entries(changed).map(([key, val]) => {
        if (val && typeof val === "object" && ("old" in val || "new" in val)) {
          return `<div><span class="diff-key">${key}</span>: <span class="diff-old">${JSON.stringify(val.old)}</span> → <span class="diff-new">${JSON.stringify(val.new)}</span></div>`;
        }
        return `<div><span class="diff-key">${key}</span>: ${JSON.stringify(val)}</div>`;
      }).join("");
    }

    async function loadHistory() {
      el("historyList").innerHTML = "불러오는 중";
      let query = supabaseClient
        .from("audit_logs_view")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(100);

      const actor = el("filterActor").value.trim();
      const biz = el("filterBusiness").value.trim();
      const action = el("filterAction").value;

      if (actor) query = query.ilike("actor_display", `%${actor}%`);
      if (biz) query = query.ilike("business_name", `%${biz}%`);
      if (action) query = query.eq("action", action);

      const { data, error } = await query;
      if (error) {
        el("historyList").innerHTML = `조회 실패: ${error.message}`;
        return;
      }
      if (!data || data.length === 0) {
        el("historyList").innerHTML = "이력이 없습니다.";
        return;
      }
      el("historyList").innerHTML = `
        <table>
          <thead>
            <tr><th>일시</th><th>액션</th><th>사업장</th><th>고객번호</th><th>등록자</th><th>변경내용</th></tr>
          </thead>
          <tbody>
            ${data.map(r => `
              <tr>
                <td>${new Date(r.created_at).toLocaleString("ko-KR")}</td>
                <td><span class="badge ${r.action.toLowerCase().includes('delete') ? 'delete' : r.action.toLowerCase().includes('update') ? 'update' : r.action.toLowerCase().includes('force') ? 'force' : 'insert'}">${r.action}</span></td>
                <td>${r.business_name || "-"}</td>
                <td>${r.customer_id || "-"}</td>
                <td>${r.actor_display || "-"}</td>
                <td style="max-width:280px;">${renderDiff(r.action, r.changed_fields)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    el("addUserBtn").addEventListener("click", async () => {
      const email = el("newUserEmail").value.trim();
      const name = el("newUserName").value.trim();
      const role = el("newUserRole").value;
      if (!email) return;
      const { error } = await supabaseClient.from("allowed_users").insert({ email, name: name || null, role });
      if (error) {
        el("userStatus").innerHTML = `<p class="status-msg warn">추가 실패: ${error.message}</p>`;
        return;
      }
      el("newUserEmail").value = "";
      el("newUserName").value = "";
      el("userStatus").innerHTML = `<p class="status-msg ok">${name || email} 추가됨</p>`;
      loadUsers();
    });

    async function loadUsers() {
      const { data, error } = await supabaseClient
        .from("allowed_users")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        el("userList").innerHTML = `조회 실패: ${error.message}`;
        return;
      }
      el("userList").innerHTML = `
        <table>
          <thead><tr><th>이메일</th><th>이름</th><th>권한</th><th>등록일</th><th></th></tr></thead>
          <tbody>
            ${data.map(u => `
              <tr>
                <td>${u.email}</td>
                <td><input type="text" class="nameEdit" data-email="${u.email}" value="${u.name || ""}" style="width:100px; padding:4px 6px; border:1px solid var(--border-strong); border-radius:4px; font-size:13px;" /></td>
                <td>
                  <select data-email="${u.email}" class="roleSelect">
                    <option value="user" ${u.role === "user" ? "selected" : ""}>user</option>
                    <option value="admin" ${u.role === "admin" ? "selected" : ""}>admin</option>
                  </select>
                </td>
                <td>${new Date(u.created_at).toLocaleDateString("ko-KR")}</td>
                <td><button class="danger" data-del="${u.email}">삭제</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      document.querySelectorAll(".nameEdit").forEach(inp => {
        inp.addEventListener("change", async () => {
          const email = inp.dataset.email;
          const { error } = await supabaseClient
            .from("allowed_users")
            .update({ name: inp.value.trim() || null })
            .eq("email", email);
          if (error) alert("이름 변경 실패: " + error.message);
        });
      });

      document.querySelectorAll(".roleSelect").forEach(sel => {
        sel.addEventListener("change", async () => {
          const email = sel.dataset.email;
          const { error } = await supabaseClient
            .from("allowed_users")
            .update({ role: sel.value })
            .eq("email", email);
          if (error) alert("권한 변경 실패: " + error.message);
        });
      });

      document.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const email = btn.dataset.del;
          if (email === currentEmail) {
            alert("본인 계정은 삭제할 수 없습니다.");
            return;
          }
          if (!confirm(`${email} 계정의 접근 권한을 삭제할까요?`)) return;
          const { error } = await supabaseClient.from("allowed_users").delete().eq("email", email);
          if (error) {
            alert("삭제 실패: " + error.message);
            return;
          }
          loadUsers();
        });
      });
    }

    el("uploadCsvBtn").addEventListener("click", () => {
      const file = el("csvFile").files[0];
      if (!file) {
        el("csvStatus").innerHTML = `<p class="status-msg warn">파일을 선택해주세요.</p>`;
        return;
      }
      el("csvStatus").innerHTML = `업로드 중`;

      Papa.parse(file, {
        skipEmptyLines: true,
        complete: async (result) => {
          const rows = result.data;
          const records = [];
          const skippedRows = [];
          let skipped = 0;

          for (const row of rows) {
            let rawId = (row[0] || "").toString().trim();
            const name = (row[1] || "").toString().trim();
            const mobile = (row[2] || "").toString().trim();

            // 엑셀에서 숫자로 저장되면 앞자리 0이 잘려나가는 경우가 있어 8자리로 보정
            if (/^\d+$/.test(rawId) && rawId.length <= 8) {
              rawId = rawId.padStart(8, "0");
            }

            if (/^\d{8}$/.test(rawId)) {
              records.push({
                customer_id: rawId,
                is_temp_id: false,
                is_member: true,
                name: name || null,
                mobile_phone: mobile || null
              });
            } else {
              skipped++;
              skippedRows.push(`[${row[0] || ""}, ${row[1] || ""}, ${row[2] || ""}]`);
            }
          }

          if (records.length === 0) {
            el("csvStatus").innerHTML = `<p class="status-msg warn">유효한 행이 없습니다. 첫 번째 열이 8자리 숫자 고객번호인지 확인해주세요.</p>`;
            return;
          }

          // 1) 새 명단을 먼저 반영 (조합원으로 등록/갱신)
          const { error } = await supabaseClient
            .from("customers")
            .upsert(records, { onConflict: "customer_id" });

          if (error) {
            el("csvStatus").innerHTML = `<p class="status-msg warn">업로드 실패: ${error.message}</p>`;
            return;
          }

          // 2) 이번 파일에 없는 기존 조합원 처리
          //    - 사업장에서 참조된 적 없으면 완전 삭제
          //    - 사업장에서 참조 중이면 조합원 표시만 해제 (참조 무결성 때문에 삭제 불가)
          const uploadedIds = records.map(r => r.customer_id);
          const { error: resetError } = await supabaseClient.rpc("replace_member_list", {
            new_ids: uploadedIds
          });

          if (resetError) {
            el("csvStatus").innerHTML = `<p class="status-msg warn">신규 명단은 반영됐지만, 기존 명단 정리 중 오류: ${resetError.message}</p>`;
            return;
          }

          // 3) 업로드 이력 기록
          await supabaseClient.from("member_upload_logs").insert({
            uploaded_by: currentEmail,
            file_name: file.name,
            row_count: records.length
          });

          el("csvStatus").innerHTML = `
            <p class="status-msg ok">${records.length}건 등록 완료 (건너뜀 ${skipped}건) — 이 파일 기준으로 조합원 명단이 갱신되었습니다.</p>
            ${skippedRows.length > 0 ? `
              <details style="margin-top:8px; font-size:12.5px; color:var(--warn);">
                <summary style="cursor:pointer;">건너뛴 행 상세 보기 (${skippedRows.length}건)</summary>
                <div style="margin-top:6px; white-space:pre-wrap; font-family:monospace; background:#fbf0e6; padding:8px; border-radius:6px;">${skippedRows.join("\n")}</div>
              </details>
            ` : ""}
          `;
          el("csvFile").value = "";
          loadMembers();
          loadUploadLogs();
        }
      });
    });

    el("memberSearchBtn").addEventListener("click", loadMembers);

    async function loadUploadLogs() {
      el("uploadLogList").innerHTML = "불러오는 중";
      const { data, error } = await supabaseClient
        .from("member_upload_logs")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(10);

      if (error) {
        el("uploadLogList").innerHTML = `조회 실패: ${error.message}`;
        return;
      }
      if (!data || data.length === 0) {
        el("uploadLogList").innerHTML = "업로드 기록이 없습니다.";
        return;
      }
      el("uploadLogList").innerHTML = `
        <table>
          <thead><tr><th>업로드 일시</th><th>파일명</th><th>건수</th><th>업로드한 사람</th></tr></thead>
          <tbody>
            ${data.map(r => `
              <tr>
                <td>${new Date(r.created_at).toLocaleString("ko-KR")}</td>
                <td>${r.file_name || "-"}</td>
                <td>${r.row_count ?? "-"}</td>
                <td>${r.uploaded_by || "-"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function loadMembers() {
      el("memberList").innerHTML = "불러오는 중";

      const { count } = await supabaseClient
        .from("customers")
        .select("*", { count: "exact", head: true })
        .eq("is_member", true);
      el("memberCount").textContent = count ?? "-";

      const search = el("memberSearch").value.trim();
      let query = supabaseClient
        .from("customers")
        .select("*")
        .eq("is_member", true)
        .order("customer_id")
        .limit(200);

      if (search) {
        query = query.or(`customer_id.ilike.%${search}%,name.ilike.%${search}%`);
      }

      const { data, error } = await query;
      if (error) {
        el("memberList").innerHTML = `조회 실패: ${error.message}`;
        return;
      }
      if (!data || data.length === 0) {
        el("memberList").innerHTML = "등록된 조합원이 없습니다.";
        return;
      }
      el("memberList").innerHTML = `
        <table>
          <thead><tr><th>고객번호</th><th>성명</th><th>휴대폰번호</th></tr></thead>
